l="#6B6F80" text-anchor="start" opacity="1">The sidebar has no fill of its own: tabs are white or ink at low alpha,</text><text x="396" y="196" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B6F80" text-anchor="start" opacity="1">so the Space gradient (plus grain) shows through everything.</text><rect x="396" y="234" width="716" height="36" rx="10" fill="#FAFBFF"/><text x="412" y="258" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0E0F10" text-anchor="start" opacity="1">Current tab</text><text x="1096" y="258" font-family="'SF Mono', 'Space Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#6B6F80" text-anchor="end" opacity="1">#FFFFFF · 85%</text><rect x="396" y="280" width="716" height="36" rx="10" fill="#FAFBFF"/><text x="412" y="304" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0E0F10" text-anchor="start" opacity="1">Hovered tab</text><text x="1096" y="304" font-family="'SF Mono', 'Space Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#6B6F80" text-anchor="end" opacity="1">#0E0F10 · 10%</text><rect x="396" y="326" width="716" height="36" rx="10" fill="#FAFBFF"/><text x="412" y="350" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0E0F10" text-anchor="start" opacity="1">Sidebar item</text><text x="1096" y="350" font-family="'SF Mono', 'Space Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#6B6F80" text-anchor="end" opacity="1">#0E0F10 · 5%</text><rect x="396" y="372" width="716" height="36" rx="10" fill="#FAFBFF"/><text x="412" y="396" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0E0F10" text-anchor="start" opacity="1">Space theme</text><text x="1096" y="396" font-family="'SF Mono', 'Space Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#6B6F80" text-anchor="end" opacity="1">#F29BBB → #6CBAD9</text><rect x="396" y="418" width="716" height="36" rx="10" fill="#FAFBFF"/><text x="412" y="442" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0E0F10" text-anchor="start" opacity="1">Content corner</text><text x="1096" y="442" font-family="'SF Mono', 'Space Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#6B6F80" text-anchor="end" opacity="1">rounded, inset from window</text><rect x="396" y="464" width="716" height="36" rx="10" fill="#FAFBFF"/><text x="412" y="488" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0E0F10" text-anchor="start" opacity="1">Overlay</text><text x="1096" y="488" font-family="'SF Mono', 'Space Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#6B6F80" text-anchor="end" opacity="1">grain / sand / denim / tweed</text><text x="1144" y="596" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#FFFFFF" text-anchor="end" opacity="0.85">Illustration drawn from tokens, not a screenshot</text></svg>
